<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>音楽と100マス計算</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface2:#ECEFF3; --ink:#1D2936; --muted:#596472; --line:#CAD1DA; --line-strong:#7F8B9B;
  --head:#E6ECF3; --accent:#1F3A5F; --accent-ink:#FFFFFF; --accent-soft:#DBE5F1;
  --cur:#FFF2BF; --cur-line:#B9800F; --warn:#A23F18; --warn-soft:#FBE8DE; --ok:#2C6845; --ok-soft:#DFEFE5;
  --shadow:0 1px 2px rgba(20,32,48,.06),0 4px 16px rgba(20,32,48,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161B; --surface:#1A2028; --surface2:#222A34; --ink:#E4E8ED; --muted:#9AA5B2; --line:#323D4A; --line-strong:#5E6C7D;
    --head:#25303D; --accent:#8CB1DD; --accent-ink:#0E1621; --accent-soft:#22334A;
    --cur:#3B3418; --cur-line:#E0AE48; --warn:#EFA07C; --warn-soft:#3A2418; --ok:#86C7A0; --ok-soft:#1C3226;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161B; --surface:#1A2028; --surface2:#222A34; --ink:#E4E8ED; --muted:#9AA5B2; --line:#323D4A; --line-strong:#5E6C7D;
  --head:#25303D; --accent:#8CB1DD; --accent-ink:#0E1621; --accent-soft:#22334A;
  --cur:#3B3418; --cur-line:#E0AE48; --warn:#EFA07C; --warn-soft:#3A2418; --ok:#86C7A0; --ok-soft:#1C3226;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);margin:0;
  font-family:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  font-size:15px;line-height:1.7;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:"BIZ UDGothic","Consolas","Menlo",monospace;font-variant-numeric:tabular-nums}

/* ---------- 実験者の画面 ---------- */
.wrap{max-width:980px;margin:0 auto;padding-block:28px 64px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;margin-bottom:20px}
.top h1{font-size:24px}
.top .sub{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px}
.panel > h2{font-size:17px;display:flex;gap:10px;align-items:baseline;margin-bottom:14px}
.panel > h2 .step{font-family:"BIZ UDGothic",monospace;font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 6px;line-height:1.6}
.hint{color:var(--muted);font-size:13px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 18px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field > span{font-size:13px;font-weight:700}
input[type=text],input[type=number],input[type=time],select,textarea{
  background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:7px 10px;min-width:0;width:100%}
textarea{min-height:72px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,label.pill:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.orderline{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.chip{font-family:"BIZ UDGothic",monospace;display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:6px;background:var(--accent-soft);color:var(--ink);font-weight:700;padding:0 6px}
.arrow{color:var(--muted)}
.btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 16px;cursor:pointer;line-height:1.4}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 10px;font-size:13px;border-radius:6px}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.audiolist{display:grid;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.arow{display:grid;grid-template-columns:44px minmax(150px,1.1fr) minmax(160px,1.4fr) 132px auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow.head{background:var(--surface2);font-size:12px;font-weight:700;color:var(--muted);padding-block:6px}
.arow .cond b{display:block;font-size:14px}
.arow .cond small{color:var(--muted);font-size:12px;display:block;line-height:1.4}
.arow .file{font-size:13px;min-width:0;overflow-wrap:anywhere}
.arow .file .ok{color:var(--ok)}
.arow .file .ng{color:var(--warn)}
.arow input[type=number]{padding:4px 6px}
.offset{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:760px){
  .arow{grid-template-columns:40px 1fr;row-gap:6px}
  .arow.head{display:none}
  .arow .file,.arow .offset,.arow .acts{grid-column:2}
}
.checks{display:grid;gap:6px;margin:4px 0 14px;padding:0;list-style:none;font-size:14px}
.checks li{display:flex;gap:8px;align-items:flex-start}
.checks .m{font-weight:700;width:1.2em;flex:none}
.checks .ok .m{color:var(--ok)}
.checks .ng .m{color:var(--warn)}
.note{border-radius:8px;padding:10px 14px;font-size:14px;background:var(--surface2)}
.note.warn{background:var(--warn-soft);color:var(--ink)}
.note.warn b{color:var(--warn)}
.note.ok{background:var(--ok-soft)}
details.more summary{cursor:pointer;font-weight:700;font-size:14px}
details.more[open] summary{margin-bottom:12px}
table.list{border-collapse:collapse;width:100%;font-size:13px}
table.list th,table.list td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
table.list th{font-size:12px;color:var(--muted);font-weight:700}
.tablebox{overflow-x:auto}
.tag{font-size:11px;border-radius:4px;padding:1px 6px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.run{background:var(--warn-soft);color:var(--warn)}
.tag.done{background:var(--ok-soft);color:var(--ok)}
.msg{font-size:13px;margin-top:8px;min-height:1.2em}
.msg.err{color:var(--warn)}
.msg.ok{color:var(--ok)}

/* ---------- 参加者の画面 ---------- */
.stage{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-block:32px}
.card{width:100%;max-width:760px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:32px 36px;font-size:19px;line-height:1.85}
.card h2{font-size:24px;margin-bottom:16px}
.card p{margin:0 0 12px}
.card ul,.card ol{margin:0 0 14px;padding-left:1.3em}
.card li{margin-bottom:6px}
.card .actions{display:flex;justify-content:flex-end;gap:12px;margin-top:22px;flex-wrap:wrap}
.card .btn{font-size:18px;padding:10px 26px}
.key{font-family:"BIZ UDGothic",monospace;display:inline-block;border:1px solid var(--line-strong);border-bottom-width:3px;border-radius:5px;padding:0 7px;font-size:.85em;line-height:1.5;background:var(--surface2)}
.progress{font-size:14px;color:var(--muted);margin-bottom:8px;font-family:"BIZ UDGothic",monospace}
@media (max-width:560px){.card{padding:22px 18px;font-size:17px}}
.fix{font-size:64px;line-height:1;color:var(--ink);user-select:none;font-family:"BIZ UDGothic",monospace}
.restnote{color:var(--muted);font-size:17px;margin-top:40px;text-align:center}
.count{font-size:120px;line-height:1;font-family:"BIZ UDGothic",monospace;font-weight:700;color:var(--accent)}
.big{font-size:44px;font-weight:700;margin-bottom:12px}

/* 100マス */
.taskbar{width:100%;max-width:900px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 14px;border-radius:10px;margin-bottom:10px}
.taskbar.cue{animation:cue 1.2s ease-out}
@keyframes cue{0%{background:var(--accent);color:var(--accent-ink)}100%{background:transparent}}
.taskbar .opname{font-size:26px;font-weight:700}
.taskbar .ophow{font-size:17px;color:var(--muted);margin-left:10px;font-weight:400}
.sheetinfo{display:flex;align-items:center;gap:12px}
.sheetno{font-family:"BIZ UDGothic",monospace;font-size:16px;font-weight:700;border:1px solid var(--line-strong);border-radius:999px;padding:2px 12px}
.sheetnote{font-size:15px;font-weight:700;color:var(--accent);animation:fadeaway 3.5s forwards}
@keyframes fadeaway{0%,70%{opacity:1}100%{opacity:0}}
.steps{display:flex;gap:6px;font-size:15px}
.steps span{padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps span.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.steps span.past{text-decoration:line-through}
.masu{--c:min(calc((100vh - 140px) / 11), calc((100vw - 48px) / 11), 64px);border-collapse:collapse;font-family:"BIZ UDGothic","Consolas",monospace;user-select:none}
@supports (height:100dvh){.masu{--c:min(calc((100dvh - 140px) / 11), calc((100vw - 48px) / 11), 64px)}}
.masu th,.masu td{width:var(--c);height:var(--c);min-width:var(--c);font-size:calc(var(--c) * .5);text-align:center;vertical-align:middle;padding:0;border:1px solid var(--line-strong)}
.masu th{background:var(--head);font-weight:700;border-width:2px}
.masu td{background:var(--surface)}
.masu td.cur{background:var(--cur);box-shadow:inset 0 0 0 3px var(--cur-line)}
.masu td.cur::after{content:"";display:inline-block;width:2px;height:.9em;background:var(--ink);vertical-align:-0.1em;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.masu td.done{color:var(--ink)}
.taskhint{margin-top:10px;font-size:14px;color:var(--muted)}
.donebox{margin-top:10px;font-size:17px;color:var(--accent);font-weight:700}

/* Affect Grid */
.agbox{display:flex;flex-direction:column;align-items:center}
.ag{--g:min(46px, calc((100vw - 220px) / 9), calc((100vh - 330px) / 10));display:grid;grid-template-columns:auto repeat(9, var(--g)) auto;grid-template-rows:auto repeat(9, var(--g)) auto;user-select:none}
.ag.compact{--g:min(38px, calc((100vw - 220px) / 9))}
@media (max-width:560px){.ag{--g:calc((100vw - 150px) / 9)}.ag.compact{--g:calc((100vw - 150px) / 9)}}
.ag .lab{font-size:14px;font-weight:700;color:var(--muted);display:flex;align-items:center;white-space:nowrap;padding:4px 8px}
.ag .lab.r{justify-content:flex-end}
.ag .lab.c{justify-content:center}
.ag .lab .ax{color:var(--accent);margin:0 4px;font-size:12px}
.ag .lab.side{font-size:16px;color:var(--ink)}
.ag .lab.top,.ag .lab.bottom{white-space:normal;text-align:center;line-height:1.35}
.ag .lab.top,.ag .lab.bottom{color:var(--ink)}
.agguide{font-size:16px;line-height:1.7;margin:0 0 14px;padding-left:1.2em}
.qnote{font-size:13px;font-weight:400;color:var(--muted)}
.ag button{appearance:none;border:1px solid var(--line-strong);margin:0 -1px -1px 0;background:var(--surface);cursor:pointer;padding:0;font-size:calc(var(--g) * .62);line-height:1;color:var(--accent);font-weight:700}
.ag button:hover{background:var(--surface2)}
.ag button.mid{background:var(--surface2)}
.ag button.sel{background:var(--accent-soft)}
.agcap{font-size:15px;color:var(--muted);margin:8px 0 0;text-align:center}

/* アンケート */
.form{width:100%;max-width:820px}
.form .card{max-width:none}
.qsec{font-size:18px;font-weight:700;margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--accent)}
.qsec:first-of-type{margin-top:0}
.q{padding:12px 0 14px;border-bottom:1px solid var(--line)}
.q .qt{font-size:17px;margin-bottom:8px;line-height:1.6}
.q .qt .req{color:var(--warn);font-size:12px;margin-left:6px;font-weight:700}
.q.missing{background:var(--warn-soft);border-radius:8px;padding-inline:10px}
.q.missing .qt::after{content:"　← 回答してください";color:var(--warn);font-size:14px;font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:8px}
label.pill{position:relative;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line-strong);border-radius:999px;padding:6px 16px;cursor:pointer;font-size:16px;background:var(--surface);min-height:40px}
label.pill input{position:absolute;opacity:0;pointer-events:none}
label.pill:hover{background:var(--surface2)}
label.pill:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.scale{display:grid;grid-template-columns:repeat(7, minmax(40px, 56px));gap:6px}
.scale label.pill{border-radius:8px;padding:6px 0;font-family:"BIZ UDGothic",monospace}
.anchors{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px;max-width:calc(7 * 56px + 36px);gap:12px}
.extra{margin-top:8px}
.follow{margin-top:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:15px}
.follow .inline{flex-wrap:nowrap}
.follow input[type=text]{width:240px;max-width:100%}
.follow input[type=number]{width:100px}
.follow input[type=time]{width:140px}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.inline input{max-width:140px}
.q.missing .qt[data-range]::after{content:attr(data-range)}
.ratings{display:grid;grid-template-columns:1fr;gap:24px;align-items:start}
@media (min-width:1180px){.ratings.two{grid-template-columns:auto 1fr}}
.formerr{color:var(--warn);font-weight:700;font-size:15px;margin-right:auto;align-self:center}
.replay{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:6px 0 18px;box-shadow:var(--shadow)}
.replay-head{font-size:16px;font-weight:700;margin-bottom:8px}
.replay-list{display:flex;flex-wrap:wrap;gap:8px}
.rp{appearance:none;display:inline-flex;flex-direction:column;align-items:center;gap:2px;min-width:86px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);cursor:pointer;font-size:15px;line-height:1.3}
.rp:hover{background:var(--surface2)}
.rp .ic,.rp span{font-size:13px;color:var(--muted)}
.rp.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rp.on .ic{color:var(--accent-ink)}
.rp.silent{cursor:default;background:var(--surface2);border-style:dashed}

/* 実験者メニュー */
.xbtn{position:fixed;right:calc(10px + env(safe-area-inset-right, 0px));bottom:calc(10px + env(safe-area-inset-bottom, 0px));z-index:30;font-size:12px;opacity:.3;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;cursor:pointer;color:var(--muted)}
.xbtn:hover{opacity:1}
.xpanel{position:fixed;right:calc(10px + env(safe-area-inset-right, 0px));bottom:calc(46px + env(safe-area-inset-bottom, 0px));z-index:31;width:min(340px, calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:14px;font-size:14px}
.xpanel h3{font-size:14px;margin-bottom:6px}
.xpanel .row{margin-top:8px}
.xpanel .btn{font-size:13px;padding:6px 10px}
.banner{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top, 0px));transform:translateX(-50%);z-index:40;background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:8px;padding:8px 16px;font-size:16px;font-weight:700;max-width:calc(100vw - 32px)}
</style>

<div id="app"></div>

<script type="application/json" id="clips-meta">{"target_lufs": -25.0, "max_tp": -1.0, "clips": []}</script>
<script>
"use strict";
/* =========================================================================
   音楽と100マス計算（予備実験用）  —  1ファイルで動く実験プログラム
   データは この端末のブラウザ（localStorage）に自動で残り、終了画面から
   ZIP（CSV 5種＋JSON）で保存する。
   ========================================================================= */
const APP_VERSION = "2026-11-20";
const PREFS_V = 4;   // 時間の設定を覚えた版（変えたら古い設定を使わない）
const CODES = ["A","B","C","D","E","F","G"];
const COND = {
  A:{label:"自選曲",        song:"参加者が選んだ曲",                    lyrics:null},
  B:{label:"歌詞あり・速い", song:"歌詞あり・テンポの速い曲（120 BPM以上）",                lyrics:true},
  C:{label:"歌詞あり・遅い", song:"歌詞あり・テンポの遅い曲（90 BPM以下）",          lyrics:true},
  D:{label:"歌詞なし・速い", song:"歌詞なし・テンポの速い曲（120 BPM以上）", lyrics:false},
  E:{label:"歌詞なし・遅い", song:"歌詞なし・テンポの遅い曲（90 BPM以下）", lyrics:false},
  F:{label:"K.448",        song:"モーツァルト K.448 第1楽章",            lyrics:false},
  G:{label:"無音",          song:"なし（ヘッドホンは着ける）",             lyrics:null},
};
const KEYWORDS = { F:["448","mozart","モーツァルト"] };   // ファイル名の先頭を「B_」のようにすると、その条件に自動で割り当てる
const OPS = {
  add:{name:"たし算", sym:"＋", how:"左の数と上の数を足す",     f:(a,b)=>a+b},
  sub:{name:"ひき算", sym:"－", how:"左の数から上の数を引く",   f:(a,b)=>a-b},
  mul:{name:"かけ算", sym:"×", how:"左の数（2けた）と上の数（1けた）をかける",   f:(a,b)=>a*b},
};
const BASE_SEED = 20261106;
const DEFAULTS = {rest_s:60, practice:true, lead_s:30, task_s:120, practice_s:60, break_s:0, volume:100, theme:"light"};
const TEST = {rest_s:5, lead_s:5, task_s:30, practice_s:10, break_s:0};

/* ---------- 小道具 ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = (n, w=2) => String(n).padStart(w, "0");
function isoLocal(ms){
  const d = new Date(ms), off = -d.getTimezoneOffset(), a = Math.abs(off);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(),3)}${off>=0?"+":"-"}${pad(Math.floor(a/60))}:${pad(a%60)}`;
}
function stamp(){ const e = Date.now(); return {iso:isoLocal(e), epoch_ms:e, perf_ms:Math.round(performance.now()*10)/10}; }
const mmss = (s) => (s==null || !isFinite(s)) ? "—" : `${Math.floor(s/60)}:${pad(Math.floor(s%60))}`;
function median(a){ if(!a.length) return null; const b=[...a].sort((x,y)=>x-y), m=b.length>>1; return b.length%2 ? b[m] : (b[m-1]+b[m])/2; }
function mulberry32(a){ return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* Williams 法（7条件・14通り）— Word の手順書と同じ表 */
function williams(){
  const n=7, first=[0]; let lo=1, hi=n-1;
  for(let j=1;j<n;j++){ if(j%2) first.push(lo++); else first.push(hi--); }
  const rows = Array.from({length:n}, (_, r) => first.map((x) => (x + r) % n));

      return {ok:false, code, msg};
    }
  }
  if(inArtifact()) return {ok:false, code:"unavailable", msg:"このページの中では保存できませんでした。HTMLファイル版をパソコンで開いて使ってください（データはこの端末に残っています）。"};
  try{
    const blob = data instanceof Blob ? data : new Blob([data], {type:"text/plain"});
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();

}

/* セッション → 表 */
function baseOf(s){ return {participant_id:s.participant_id, week:s.week, session_id:s.session_id, order_no:s.order_no, test_mode:s.test_mode?1:0}; }
function tables(s){
  const base = baseOf(s), trials = [], summary = [], events = [], quest = [];
  const pushTrials = (blocks, phase, pos, code) => (blocks || []).forEach((b) => b.entries.forEach((x) => trials.push({
    ...base, phase, position:pos, condition:code, op:b.op, sheet_no:b.sheet_no, sheet_id:b.sheet_id, n:x.n, k:x.k, row:x.row, col:x.col,
    left:x.a, top:x.b, correct_answer:x.ans, response:x.resp, response_raw:x.raw, is_correct:x.ok,
    rt_ms:x.rt_ms, first_key_ms:x.first_ms, n_backspace:x.bs, key_source:x.src, t_in_task_ms:x.t_ms, answer_iso:x.iso, epoch_ms:x.epoch_ms,
  })));
  const taskCols = (blocks, taskS) => {
    // 正答数・解答数（確定した数）・誤答数・正答率、1分ごとの内訳、表の枚数
    const has = !!(blocks && blocks.length), e = has ? blocks.flatMap((b) => b.entries) : [];
    const ok = e.filter((x) => x.ok), o = {};
    o.correct = has ? ok.length : null; o.attempted = has ? e.length : null; o.wrong = has ? e.length - ok.length : null;
    o.accuracy = e.length ? Math.round(ok.length / e.length * 10000) / 10000 : null;
    o.correct_per_min = has && taskS ? Math.round(ok.length / (taskS / 60) * 100) / 100 : null;
    o.rt_median_ms = median(ok.map((x) => x.rt_ms));
    for(let m = 1; m <= 3; m++){
      const inM = e.filter((x) => x.t_ms >= (m - 1) * 60000 && x.t_ms < m * 60000);
      o[`m${m}_correct`] = has && taskS > (m - 1) * 60 ? inM.filter((x) => x.ok).length : null;
      o[`m${m}_attempted`] = has && taskS > (m - 1) * 60 ? inM.length : null;
    }
    o.sheets_started = has ? blocks.length : null;
    o.sheets_completed = has ? blocks.filter((b) => b.completed_all).length : null;
    o.first_sheet = has ? blocks[0].sheet_id : null;
    o.ime_warnings = (blocks || []).reduce((s, b) => s + (b.ime_warn || 0), 0);
    o.leave_window = (blocks || []).reduce((s, b) => s + (b.blur || 0), 0);
    return o;
  };
  if(s.practice){
    pushTrials(s.practice.blocks, "practice", 0, "P");
    summary.push({...base, phase:"practice", position:0, condition:"P", condition_label:"練習", task_start_iso:s.practice.start && s.practice.start.iso, task_start_epoch_ms:s.practice.start && s.practice.start.epoch_ms, task_end_iso:s.practice.end && s.practice.end.iso, ...taskCols(s.practice.blocks, s.settings.practice_s)});
  }
  for(let pos=1; pos<=7; pos++){
    const c = s.conds[pos]; if(!c) continue;
    pushTrials(c.task && c.task.blocks, "main", pos, c.code);
    const r = (c.ratings && c.ratings.items) || {}, am = s.audio_meta[c.code] || {};
    const a1 = c.ag_pre || {}, a2 = c.ag_post || {}, au = (c.task && c.task.audio) || {};
    summary.push({
      ...base, phase:"main", position:pos, condition:c.code, condition_label:COND[c.code].label,
      audio_file: am.file || (c.code==="G" ? "（無音）" : null), audio_offset_s: am.offset_s ?? null, audio_duration_s: am.duration_s ?? null, volume_pct: s.settings.volume,
      audio_embedded: am.embedded ? 1 : (am.file ? 0 : null), audio_lufs: am.lufs ?? null, audio_gain_db: am.gain_db ?? null,
      lead_start_iso: c.task && c.task.lead && c.task.lead.start && c.task.lead.start.iso, lead_start_epoch_ms: c.task && c.task.lead && c.task.lead.start && c.task.lead.start.epoch_ms,
      rest_start_iso: c.rest && c.rest.start && c.rest.start.iso, rest_start_epoch_ms: c.rest && c.rest.start && c.rest.start.epoch_ms, rest_end_iso: c.rest && c.rest.end && c.rest.end.iso,
      task_start_iso: c.task && c.task.start && c.task.start.iso, task_start_epoch_ms: c.task && c.task.start && c.task.start.epoch_ms,
      task_end_iso: c.task && c.task.end && c.task.end.iso, task_end_epoch_ms: c.task && c.task.end && c.task.end.epoch_ms,
      audio_playing_iso: au.playing && au.playing.iso, audio_playing_epoch_ms: au.playing && au.playing.epoch_ms, audio_stop_iso: au.stopped && au.stopped.iso, audio_position_at_stop_s: au.position_s ?? null,
      ...taskCols(c.task && c.task.blocks, s.settings.task_s ?? (s.settings.block_s ? s.settings.block_s * 3 : null)),
      ag_pre_pleasure:a1.pleasure ?? null, ag_pre_arousal:a1.arousal ?? null, ag_pre_rt_ms:a1.rt_ms ?? null,
      ag_post_pleasure:a2.pleasure ?? null, ag_post_arousal:a2.arousal ?? null, ag_post_rt_ms:a2.rt_ms ?? null,
      d_pleasure:(a1.pleasure!=null && a2.pleasure!=null) ? a2.pleasure - a1.pleasure : null,
      d_arousal:(a1.arousal!=null && a2.arousal!=null) ? a2.arousal - a1.arousal : null,
      r_like:r.like ?? null, r_familiar:r.familiar ?? null, r_bored:r.bored ?? null, r_disturb:r.disturb ?? null,
      r_lyrics:r.lyrics ?? null, song_has_lyrics: c.code === "G" ? null : ((c.code === "A" ? s.self_lyrics : COND[c.code].lyrics) ? 1 : 0),
      r_concentrate:r.concentrate ?? null, r_fatigue:r.fatigue ?? null, ratings_rt_ms: c.ratings ? c.ratings.rt_ms : null,
      ratings_end_iso: c.ratings && c.ratings.done && c.ratings.done.iso,
      break_before: (s.break && s.break.answer === "yes" && pos === 5) ? 1 : 0,
      skipped: (c.skipped || []).join(" "), restarts: c.restarts || 0,

  }
  s.events.forEach((e) => events.push({...base, iso:e.iso, epoch_ms:e.epoch_ms, perf_ms:e.perf_ms, type:e.type, phase:e.phase, position:e.pos, condition:e.code, detail:e.detail}));
  const qs = (form, rec, spec) => { if(!rec) return; spec.filter((x) => x.id).forEach((it) => { [it, ...(it.follow || [])].forEach((q) => { if(q.id in (rec.answers || {})) quest.push({...base, form, item_id:q.id, question:q.q, answer:rec.answers[q.id]}); }); }); };
  qs("pre", s.pre, PRE); qs("post", s.post, POST);
  const session = [{
    ...base, status:s.status, created_at:s.created_at, finished_at:s.finished_at || "", app_version:s.app_version,
    order:s.order.join(""), sheet_seed:s.sheet_seed, rest_s:s.settings.rest_s, lead_s:s.settings.lead_s ?? "", task_s:s.settings.task_s ?? "", target_lufs:s.settings.target_lufs ?? "", match_loudness:s.settings.match_loudness ? 1 : 0, practice_s:s.settings.practice_s,
    volume_pct:s.settings.volume, practice:s.settings.practice === false ? 0 : 1, pre_short:s.pre_short?1:0, break_answer:s.break ? s.break.answer : "", break_s: s.break && s.break.dur_s != null ? s.break.dur_s : "",
    self_song: s.self_song || "", self_lyrics: s.self_lyrics == null ? "" : (s.self_lyrics ? 1 : 0), audio_files: CODES.map((c) => `${c}=${(s.audio_meta[c]||{}).file || ""}`).join(" | "),
    user_agent:s.env.ua, screen:s.env.screen, timezone:s.env.tz,
  }];
  return {trials, summary, events, quest, session};
}
const TRIAL_COLS = ["participant_id","week","session_id","order_no","test_mode","phase","position","condition","op","sheet_no","sheet_id","n","k","row","col","left","top","correct_answer","response","response_raw","is_correct","rt_ms","first_key_ms","n_backspace","key_source","t_in_task_ms","answer_iso","epoch_ms"];
const SUM_COLS = ["participant_id","week","session_id","order_no","test_mode","phase","position","condition","condition_label","audio_file","audio_offset_s","audio_duration_s","audio_embedded","audio_lufs","audio_gain_db","volume_pct",
  "correct","attempted","wrong","accuracy","correct_per_min","rt_median_ms","m1_correct","m2_correct","m3_correct","m1_attempted","m2_attempted","m3_attempted","sheets_started","sheets_completed","first_sheet",
  "ag_pre_pleasure","ag_pre_arousal","ag_post_pleasure","ag_post_arousal","d_pleasure","d_arousal","ag_pre_rt_ms","ag_post_rt_ms",
  "r_like","r_familiar","r_bored","r_disturb","r_lyrics","song_has_lyrics","r_concentrate","r_fatigue","ratings_rt_ms",

const Q_COLS = ["participant_id","week","session_id","order_no","test_mode","form","item_id","question","answer"];
const SES_COLS = ["participant_id","week","session_id","order_no","test_mode","status","created_at","finished_at","app_version","order","sheet_seed","rest_s","lead_s","task_s","target_lufs","match_loudness","practice","practice_s","volume_pct","pre_short","break_answer","break_s","self_song","self_lyrics","audio_files","user_agent","screen","timezone"];

    if(e.currentTarget.dataset.armed){ closeX(); abortSession(); return; }
    e.currentTarget.dataset.armed = "1"; e.currentTarget.textContent = "もう一度押すと中止";
  };
  $("#xclose").onclick = closeX;
}
function closeX(){ const p = $("#xpanel"); if(p) p.hidden = true; blurActive(); }

/* ---------- 進行 ---------- */
function buildPhases(practice=true){
  const P = [{type:"welcome"}, {type:"pre"}, {type:"howto"}];
  if(practice) P.push({type:"practice"});
  for(let k=1; k<=7; k++){
    P.push({type:"ready", pos:k}, {type:"rest", pos:k}, {type:"ag_pre", pos:k}, {type:"task", pos:k}, {type:"ratings", pos:k});
  }
  P.push({type:"post"}, {type:"end"});
  return P;
}
function hasLyrics(code){ return code === "A" ? !!(S && S.self_lyrics) : !!COND[code].lyrics; }
const curCond = () => { const ph = S.phases[S.phase_idx]; return ph && ph.pos ? S.conds[ph.pos] : null; };
function go(){
  clearRuntime(); closeX();
  const ph = S.phases[S.phase_idx];
  logEvent("phase_start", {phase:ph.type});
  persist();
  (RENDER[ph.type] || RENDER.end)(ph);
}
function next(){
  const ph = S.phases[S.phase_idx];
  logEvent("phase_end", {phase:ph.type});
  S.phase_idx = Math.min(S.phase_idx + 1, S.phases.length - 1);
  go();
}
function skipPhase(){
  const ph = S.phases[S.phase_idx];
  if(ph.type === "end") return;
  if(RT.onSkip) RT.onSkip();
  const c = curCond(); if(c){ c.skipped = c.skipped || []; c.skipped.push(ph.type); }
  logEvent("phase_skipped", {phase:ph.type});
  next();
}
function abortSession(){
  if(RT.onSkip) RT.onSkip();
  logEvent("aborted", {at:S.phases[S.phase_idx].type});
  S.status = "aborted";
  S.phase_idx = S.phases.length - 1;
  go();
}
function newCond(pos, code){ return {pos, code, label:COND[code].label, skipped:[], restarts:0}; }

function itemHTML(it, ans){
  const v = ans[it.id];
  const req = it.req ? `<span class="req">必須</span>` : "";
  let body = "";
  if(it.type === "text") body = `<input type="text" data-id="${it.id}" value="${esc(v || "")}" autocomplete="off">`;
  else if(it.type === "textarea") body = `<textarea data-id="${it.id}">${esc(v || "")}</textarea>`;
  else if(it.type === "number") body = `<div class="inline"><input type="number" data-id="${it.id}" value="${esc(v ?? "")}" min="${it.min ?? ""}" max="${it.max ?? ""}" step="${it.step ?? "any"}" inputmode="decimal"><span>${esc(it.suffix || "")}</span></div>`;
  else if(it.type === "time") body = `<input type="time" data-id="${it.id}" value="${esc(v || "")}" style="max-width:160px">`;
  else if(it.type === "choice") body = `<div class="opts">${it.opts.map((o) => `<label class="pill"><input type="radio" name="${it.id}" value="${esc(o)}" ${v === o ? "checked" : ""}><span>${esc(o)}</span></label>`).join("")}</div>`;
  else if(it.type === "multi"){ const sel = String(v || "").split("|"); body = `<div class="opts">${it.opts.map((o) => `<label class="pill"><input type="checkbox" name="${it.id}" value="${esc(o)}" ${sel.includes(o) ? "checked" : ""}><span>${esc(o)}</span></label>`).join("")}</div>`; }
  else if(it.type === "scale7") body = scaleHTML(it.id, v, it.lo, it.hi);
  let follow = "";
  if(it.follow){
    const show = followShown(it, v);
    follow = `<div class="follow" data-follow="${it.id}" ${show ? "" : "hidden"}>${it.follow.map((f) => `<label class="inline"><span>${esc(f.q)}</span>${f.type === "number" ? `<input type="number" data-id="${f.id}" value="${esc(ans[f.id] ?? "")}" min="${f.min ?? ""}" max="${f.max ?? ""}" step="${f.step ?? "any"}"><span>${esc(f.suffix || "")}</span>` : f.type === "time" ? `<input type="time" data-id="${f.id}" value="${esc(ans[f.id] || "")}">` : `<input type="text" data-id="${f.id}" value="${esc(ans[f.id] || "")}" autocomplete="off">`}</label>`).join("")}</div>`;
  }
  return `<div class="q" data-q="${it.id}"><div class="qt">${esc(it.q)}${req}</div>${body}${follow}</div>`;
}
function scaleHTML(name, v, lo, hi, none){
  return `<div class="scale" role="radiogroup">${[1,2,3,4,5,6,7].map((n) => `<label class="pill"><input type="radio" name="${name}" value="${n}" ${String(v) === String(n) ? "checked" : ""}><span>${n}</span></label>`).join("")}</div>
    <div class="anchors"><span>1＝${esc(lo)}</span><span>7＝${esc(hi)}</span></div>
    ${none ? `<div class="extra"><label class="pill"><input type="radio" name="${name}" value="none" ${v === "none" ? "checked" : ""}><span>${esc(none)}</span></label></div>` : ""}`;
}
function followShown(it, v){
  if(v == null || v === "") return false;
  if(it.followOn === "*") return true;
  if(it.type === "multi") return String(v).split("|").includes(it.followOn);
  return v === it.followOn;
}
function readForm(root, spec){
  const ans = {};
  spec.filter((x) => x.id).forEach((it) => {
    [it, ...(it.follow || [])].forEach((q) => {
      if(q.type === "multi"){ const els = $$(`input[name="${q.id}"]:checked`, root); if(els.length) ans[q.id] = els.map((x) => x.value).join("|"); }
      else if(q.type === "choice" || q.type === "scale7"){ const el = $(`input[name="${q.id}"]:checked`, root); if(el) ans[q.id] = q.type === "scale7" ? parseInt(el.value, 10) : el.value; }
      else { const el = $(`[data-id="${q.id}"]`, root); if(el && el.value.trim() !== "") ans[q.id] = q.type === "number" ? parseFloat(el.value) : el.value.trim(); }
    });
    if(it.follow && !followShown(it, ans[it.id])) it.follow.forEach((f) => delete ans[f.id]);
  });
  return ans;
}
function questionnaire(key, spec, title, lead, prog, topHTML, onBind){
  const rec = S[key] = S[key] || {answers:{}};
  rec.shown = rec.shown || stamp();
  const ans = rec.answers;
  let html = "";
  spec.forEach((it) => { html += it.sec ? `<div class="qsec">${esc(it.sec)}</div>` : itemHTML(it, ans); });
  app.innerHTML = `<div class="stage"><div class="form">${card(`<h2>${esc(title)}</h2><p>${esc(lead)}</p>${topHTML || ""}${html}
    <div class="actions"><span class="formerr" id="ferr"></span><button class="btn primary" id="done">回答して次へ</button></div>`, prog)}</div></div>${xButton()}`;
  bindXButton(); window.scrollTo(0, 0);
  const root = $(".form");
  if(onBind) onBind(root);
  root.addEventListener("change", () => {
    const now = readForm(root, spec);
    spec.filter((x) => x.follow).forEach((it) => { const box = $(`[data-follow="${it.id}"]`, root); if(box) box.hidden = !followShown(it, now[it.id]); });
    $$(".q.missing", root).forEach((q) => { const id = q.dataset.q; if(now[id] != null) q.classList.remove("missing"); });
    rec.answers = now; persistSoon();
  });
  $("#done").onclick = () => {
    const now = readForm(root, spec);
    const miss = spec.filter((x) => x.id && x.req && now[x.id] == null);
    const bad = spec.filter((x) => x.type === "number" && now[x.id] != null && ((x.min != null && now[x.id] < x.min) || (x.max != null && now[x.id] > x.max)));
    $$(".q .qt[data-range]", root).forEach((t) => t.removeAttribute("data-range"));
    bad.forEach((x) => { const t = $(`[data-q="${x.id}"] .qt`, root); if(t) t.dataset.range = `　← ${x.min}〜${x.max} の数で答えてください`; });
    miss.push(...bad);
    $$(".q", root).forEach((q) => q.classList.toggle("missing", miss.some((m) => m.id === q.dataset.q)));
    if(miss.length){ $("#ferr").textContent = bad.length && miss.length === bad.length ? "数字を確かめてください" : `未回答が ${miss.length - bad.length} 問あります`; $(`[data-q="${miss[0].id}"]`, root).scrollIntoView({behavior:"smooth", block:"center"}); return; }
    rec.answers = now; rec.done = stamp(); rec.rt_ms = Math.round(rec.done.perf_ms - rec.shown.perf_ms);
    if(RT.onSkip) RT.onSkip();
    next();
  };
}

function readyThenCount(html, onStart){

/* 100マス：決めた時間のあいだ、かけ算を解き続ける。100マスを解き終えたら、すぐ次の表に進む */
function runTask(rec, sheets, totalSec, onDone, T0){
  rec.blocks = []; rec.start = stamp();
  if(T0 == null) T0 = performance.now();
  const endAt = T0 + totalSec * 1000, op = OPS.mul;
  let si = 0, n = 0, over = false, cur = null;
  const onVis = () => { if(document.hidden && cur){ cur.blk.blur++; logEvent("hidden_during_task", {sheet:cur.blk.sheet_id}); } };
  const onBlur = () => { if(cur){ cur.blk.blur++; logEvent("blur_during_task", {sheet:cur.blk.sheet_id}); } };
  document.addEventListener("visibilitychange", onVis); window.addEventListener("blur", onBlur);
  const closeSheet = (why) => {
    if(!cur) return;
    const b = cur.blk; b.end = stamp(); b.pending = cur.typed(); b.ended_by = why;
    logEvent("sheet_end", {sheet:b.sheet_id, no:b.sheet_no, attempted:b.entries.length, correct:b.entries.filter((x) => x.ok).length, by:why});
    cur = null;
  };
  const finishAll = (why) => {
    if(over) return; over = true;
    closeSheet(why);
    document.removeEventListener("visibilitychange", onVis); window.removeEventListener("blur", onBlur);
    rec.end = stamp();
    if(why === "skipped") return;
    clearRuntime(); persist(); onDone();
  };
  RT.onSkip = () => finishAll("skipped");
  const startSheet = () => {
    const sh = sheets[si % sheets.length], no = si + 1;
    const NC = sh.cols.length, NK = sh.rows.length * NC;
    const blk = {op:"mul", sheet_id:sh.id, sheet_no:no, rows:sh.rows, cols:sh.cols, start:stamp(), entries:[], pending:"", completed_all:false, ime_warn:0, blur:0};
    rec.blocks.push(blk);
    logEvent("sheet_start", {sheet:sh.id, no});
    let grid = `<table class="masu" aria-label="計算の表"><tr><th>${op.sym}</th>${sh.cols.map((c) => `<th>${c}</th>`).join("")}</tr>`;
    sh.rows.forEach((r, i) => { grid += `<tr><th>${r}</th>${sh.cols.map((c, j) => `<td data-k="${i*NC+j}"></td>`).join("")}</tr>`; });
    grid += `</table>`;
    app.innerHTML = `<div class="stage" style="padding-block:12px">
      <div class="taskbar ${no > 1 ? "cue" : ""}"><div><span class="opname">${op.name}</span><span class="ophow">${op.how}</span></div>
        <div class="sheetinfo">${no > 1 ? `<span class="sheetnote">新しい表です。続けて解いてください</span>` : ""}<span class="sheetno">${no}枚目</span></div></div>
      ${grid}<div class="taskhint">数字キーで入力 → <span class="key">Enter</span> で確定。表を解き終えたら次の表に進みます</div>
    </div>${xButton()}`;
    bindXButton(); blurActive();
    const cells = $$(".masu td");
    let k = 0, typed = "", shownAt = performance.now(), first = null, bs = 0, src = new Set();
    cur = {blk, typed:() => typed};
    const paint = () => { const td = cells[k]; if(td){ td.classList.add("cur"); td.textContent = typed; } };
    paint();
    const onDown = (e) => {
      if(over) return;
      if(e.target && e.target.closest && e.target.closest("#xpanel")) return;
      if(e.isComposing || e.key === "Process"){ blk.ime_warn++; e.preventDefault(); banner("入力モードを「半角英数」にしてください（実験者に知らせてください）", 3000); return; }
      let d = null, s = "";
      if(/^Digit[0-9]$/.test(e.code)){ d = e.code.slice(5); s = "row"; }
      else if(/^Numpad[0-9]$/.test(e.code)){ d = e.code.slice(6); s = "pad"; }
      else if(/^[0-9]$/.test(e.key)){ d = e.key; s = "key"; }
      if(d !== null){
        e.preventDefault();
        if(typed.length >= 3) return;
        typed += d; if(first === null) first = performance.now() - shownAt; src.add(s); paint(); return;
      }
      if(e.key === "Backspace" || e.key === "Delete"){ e.preventDefault(); if(typed){ typed = typed.slice(0, -1); bs++; paint(); } return; }
      if(e.key === "Enter" || e.code === "NumpadEnter"){
        e.preventDefault();
        if(!typed) return;
        const now = performance.now(), wall = Date.now(), i = Math.floor(k / NC), j = k % NC, a = sh.rows[i], b = sh.cols[j], ans = op.f(a, b), resp = parseInt(typed, 10);
        n++;
        blk.entries.push({n, k:k+1, row:i+1, col:j+1, a, b, ans, resp, raw:typed, ok: resp === ans ? 1 : 0, rt_ms:Math.round(now - shownAt), first_ms:Math.round(first), bs, src:[...src].join("+"),
          t_ms:Math.round(now - T0), iso:isoLocal(wall), epoch_ms:wall});
        const td = cells[k]; td.classList.remove("cur"); td.classList.add("done"); td.textContent = typed;
        k++; typed = ""; first = null; bs = 0; src = new Set(); shownAt = now;
        if(k >= NK){ blk.completed_all = true; logEvent("sheet_completed", {sheet:sh.id, ms:Math.round(now - T0)}); closeSheet("completed"); si++; startSheet(); return; }
        paint(); persistSoon();
        return;
      }
      if(e.key === " " || e.key === "Tab") e.preventDefault();
    };
    const onUp = (e) => { if(e.key === " " || e.key === "Enter") e.preventDefault(); };
    if(RT.keydown){ document.removeEventListener("keydown", RT.keydown, true); RT.keydown = null; }
    if(RT.keyup){ document.removeEventListener("keyup", RT.keyup, true); RT.keyup = null; }
    onKeys(onDown, onUp);
  };
  startSheet();
  const tick = () => { const left = endAt - performance.now(); if(left <= 0) finishAll("time"); else later(tick, Math.min(40, left)); };
  later(tick, Math.min(40, Math.max(0, endAt - performance.now())));
}

function affectGridHTML(compact){
  /* Affect Grid（Russell, Weiss & Mendelsohn, 1989）：横＝快・不快、縦＝覚醒度の2軸だけを示す */
  let h = `<div class="ag ${compact ? "compact" : ""}" role="grid" aria-label="Affect Grid（横：快・不快、縦：覚醒度）">`;
  const lab = (t, cls, col, row) => `<div class="lab ${cls}" style="grid-column:${col};grid-row:${row}"><span>${t}</span></div>`;
  h += lab(`<span class="ax">▲</span>目がさえている（覚醒が高い）`, "c top", "2 / span 9", 1);
  h += lab(`<span class="ax">▼</span>眠い・ぼんやりしている（覚醒が低い）`, "c bottom", "2 / span 9", 11);
  h += lab(`<span class="ax">◀</span>不快`, "r side", 1, "2 / span 9") + lab(`快<span class="ax">▶</span>`, "side", 11, "2 / span 9");
  for(let r=0; r<9; r++) for(let c=0; c<9; c++){
    h += `<button type="button" style="grid-column:${c+2};grid-row:${r+2}" data-x="${c+1}" data-y="${9-r}" class="${r===4 && c===4 ? "mid" : ""}" aria-label="快 ${c+1}・覚醒 ${9-r}"></button>`;
  }
  return h + `</div>`;
}
function bindAffectGrid(root, rec, onChange){
  rec.shown = stamp(); rec.changes = 0;
  $$(".ag button", root).forEach((b) => b.addEventListener("click", () => {
    $$(".ag button.sel", root).forEach((x) => { x.classList.remove("sel"); x.textContent = ""; });
    b.classList.add("sel"); b.textContent = "●";
    const t = performance.now();
    if(rec.pleasure == null) rec.first_ms = Math.round(t - rec.shown.perf_ms); else rec.changes++;
    rec.pleasure = +b.dataset.x; rec.arousal = +b.dataset.y;
    onChange && onChange();
  }));
}
RENDER.ag_pre = (ph) => {
  const c = S.conds[ph.pos];
  c.ag_pre = {};
  stage(card(`<h2>今の気分</h2>
    <p>今の状態にいちばん近いマスを、1つクリックしてください。</p>
    <ul class="agguide"><li><b>横</b>は気分の快・不快：右ほど快い、左ほど不快</li><li><b>縦</b>は覚醒度（目のさえ具合）：上ほど目がさえて活発、下ほど眠くぼんやり</li><li>縦と横は別々に考えます。真ん中のマスが「どちらでもない」です</li></ul>
    <div class="agbox">${affectGridHTML(false)}<p class="agcap">例：快くて眠い → 右下、不快で目がさえている → 左上</p></div>
    <div class="actions"><button class="btn primary" id="go" disabled>次へ</button></div>`, `7つのうち ${ph.pos} つ目`));

};

RENDER.task = (ph) => {
  /* 開始（スペース）→ 曲が流れ始める → lead_s 秒は聴いて待つだけ → 100マス計算が始まる（task_s 秒、曲は流れたまま）→ 計算の終わりで曲も止まる */
  const c = S.conds[ph.pos], code = c.code, lead = S.settings.lead_s, taskS = S.settings.task_s;
  stage(card(`<h2>計算</h2><p>ヘッドホンを着けてください。曲が流れることも、流れないこともあります。</p>
    <p>準備ができたら、<span class="key">スペース</span>キーを押すか「はじめる」を押してください。${lead}秒たつと、計算が始まります。</p>
    <div class="actions"><button class="btn primary" id="go">はじめる</button></div>`));
  let started = false;
  const begin = () => {
    if(started) return; started = true; clearRuntime(); blurActive();
    c.task = {lead:{start:stamp(), planned_s:lead}};
    const t0 = performance.now();
    startAudio(code, c.task);                         // スペースと同時に曲を流し始める
    app.innerHTML = `<div class="stage"><div class="fix" id="fix">＋</div><div class="restnote" id="leadnote">このまま、楽にして待っていてください。<br>まもなく計算が始まります。</div></div>${xButton()}`;
    bindXButton();
    onKeys((e) => { if([" ", "Enter"].includes(e.key)) e.preventDefault(); }, (e) => { if(e.key === " ") e.preventDefault(); });
    [3, 2, 1].forEach((n) => { if(lead - n >= 0) later(() => { const f = $("#fix"); if(f){ f.className = "count"; f.textContent = n; } }, (lead - n) * 1000); });
    RT.onSkip = () => { c.task.lead.end = c.task.lead.end || stamp(); stopAudio(code, c.task, 150); };
    if(taskS > 2) later(() => fadeAudio(code, 2000), Math.max(0, (lead + taskS - 2) * 1000));   // 最後の2秒でフェードアウト
    later(() => {
      c.task.lead.end = stamp();
      logEvent("task_begin_after_lead", {lead_s:lead});
      runTask(c.task, sheetsOf(S, String(ph.pos)), taskS, () => {
        stopAudio(code, c.task, 150);
        stage(card(`<div class="big">やめ</div><p>ヘッドホンを外して、「次へ」を押してください。</p><div class="actions"><button class="btn primary" id="go" disabled>次へ</button></div>`));
        later(() => { const b = $("#go"); if(b) b.disabled = false; }, 1500);
        $("#go").onclick = next;
      }, t0 + lead * 1000);
      const prevSkip = RT.onSkip;
      RT.onSkip = () => { if(prevSkip) prevSkip(); stopAudio(code, c.task, 150); };
    }, lead * 1000);
  };
  $("#go").onclick = begin;
  onKeys((e) => { if(e.key === " " || e.code === "Space"){ e.preventDefault(); begin(); } }, (e) => { if(e.key === " ") e.preventDefault(); });
};

RENDER.ratings = (ph) => {
  const c = S.conds[ph.pos], silent = c.code === "G", lyr = hasLyrics(c.code);
  const items = RATE.filter((x) => !(silent && x.song) && !(x.lyricsOnly && !lyr));
  c.ag_post = {}; c.ratings = {items:{}, shown:stamp()};
  const songItems = items.filter((x) => x.song), workItems = items.filter((x) => !x.song);
  const block = (list, no) => list.map((it, i) => `<div class="q" data-q="${it.id}"><div class="qt">${no}-${i+1}　${esc(it.q)}</div>${scaleHTML("r_" + it.id, null, it.lo, it.hi, it.none)}</div>`).join("");
  const itemsHTML = silent ? `<div class="qsec">2. 計算作業について</div>${block(workItems, 2)}`
    : `<div class="qsec">2. 聴いた曲について <span class="qnote">（曲そのものについて答えてください）</span></div>${block(songItems, 2)}<div class="qsec">3. 計算作業について <span class="qnote">（曲のことではなく、作業について）</span></div>${block(workItems, 3)}`;
  app.innerHTML = `<div class="stage"><div class="form" style="max-width:1180px">${card(`<h2>計算の後の評定</h2>
    <div class="ratings two">
      <div><div class="qsec">1. 今の気分</div><p style="font-size:16px">横は快・不快、縦は覚醒度。いちばん近いマスを1つクリック（真ん中が「どちらでもない」）。</p><div class="agbox">${affectGridHTML(true)}</div></div>
      <div>${itemsHTML}</div>
    </div>
    <div class="actions"><span class="formerr" id="ferr"></span><button class="btn primary" id="go">回答して次へ</button></div>`, `7つのうち ${ph.pos} つ目`)}</div></div>${xButton()}`;
  bindXButton(); window.scrollTo(0, 0);
  const root = $(".form");
  bindAffectGrid(root, c.ag_post, () => { const f = $("#ferr"); if(f && f.dataset.ag) { f.textContent = ""; delete f.dataset.ag; } });
  root.addEventListener("change", (e) => { const q = e.target.closest(".q"); if(q) q.classList.remove("missing"); });
  RT.onSkip = () => { c.ratings.skipped = true; };
  $("#go").onclick = () => {
    const vals = {}; const miss = [];
    items.forEach((it) => { const el = $(`input[name="r_${it.id}"]:checked`, root); if(el) vals[it.id] = el.value === "none" ? "none" : parseInt(el.value, 10); else miss.push(it.id); });
    $$(".q", root).forEach((q) => q.classList.toggle("missing", miss.includes(q.dataset.q)));
    const agMissing = c.ag_post.pleasure == null;
    if(agMissing || miss.length){
      $("#ferr").textContent = agMissing ? "1. の気分のマスを選んでください" : `未回答が ${miss.length} 問あります`;
      if(agMissing) $("#ferr").dataset.ag = "1";
      if(!agMissing) $(`[data-q="${miss[0]}"]`, root).scrollIntoView({behavior:"smooth", block:"center"});
      return;
    }
    c.ag_post.done = stamp(); c.ag_post.rt_ms = Math.round(c.ag_post.done.perf_ms - c.ag_post.shown.perf_ms);
    c.ratings.items = vals; c.ratings.done = stamp(); c.ratings.rt_ms = Math.round(c.ratings.done.perf_ms - c.ratings.shown.perf_ms);
    next();
  };
};

RENDER.break = () => {
  S.break = {asked:stamp()};
  stage(card(`<h2>4つ目まで終わりました</h2><p>ここで休憩をとることができます。休憩しますか？</p>
    <div class="actions"><button class="btn" id="no">休憩しない</button><button class="btn primary" id="yes">休憩する</button></div>`, "7つのうち 4つ終了"));
  $("#no").onclick = () => { S.break.answer = "no"; S.break.dur_s = 0; next(); };
  $("#yes").onclick = () => {
    S.break.answer = "yes"; S.break.start = stamp();
    const t0 = performance.now();
    stage(card(`<h2>休憩中</h2><p>楽にしていてください。目安は${Math.round(S.settings.break_s/60*10)/10}分です。再開するときは「再開する」を押してください。</p>
      <p class="num" style="font-size:40px;margin:16px 0" id="el">0:00</p>
      <div class="actions"><button class="btn primary" id="go">再開する</button></div>`));
    const tick = () => { const el = $("#el"); if(el) el.textContent = mmss((performance.now() - t0) / 1000); later(tick, 500); };
    tick();
    const end = () => { S.break.end = stamp(); S.break.dur_s = Math.round((performance.now() - t0) / 100) / 10; };
    RT.onSkip = end;
    $("#go").onclick = () => { end(); next(); };
  };
  RT.onSkip = () => { if(!S.break.answer) S.break.answer = "skipped"; };
};

RENDER.end = () => {
  if(S.status === "running"){ S.status = "done"; }
  S.finished_at = S.finished_at || isoLocal(Date.now());
  persist();
  try{ if(document.fullscreenElement) document.exitFullscreen().catch(() => {}); }catch(e){}
  const t = tables(S);
  const rows = t.summary.filter((r) => r.phase === "main").map((r) => `<tr><td>${r.position}</td><td><span class="chip">${r.condition}</span> ${esc(r.condition_label)}</td><td class="num">${r.correct ?? "—"}</td><td class="num">${r.attempted ?? "—"}</td><td class="num">${r.accuracy != null ? (r.accuracy * 100).toFixed(1) + "%" : "—"}</td><td class="num">${r.sheets_completed ?? "—"}</td><td class="num">${r.ag_pre_pleasure ?? "—"},${r.ag_pre_arousal ?? "—"} → ${r.ag_post_pleasure ?? "—"},${r.ag_post_arousal ?? "—"}</td></tr>`).join("");
  app.innerHTML = `<div class="stage">${card(`<h2>${S.status === "aborted" ? "実験を中止しました" : "これで終わりです"}</h2><p>${S.status === "aborted" ? "実験者の指示に従ってください。" : "おつかれさまでした。実験者に声をかけてください。"}</p>
    <details class="more" style="margin-top:24px;font-size:15px"><summary>実験者用：データの保存と結果の確認</summary>
      <div class="row"><button class="btn primary" id="sv">データを保存（ZIP）</button><button class="btn" id="sj">JSONだけ保存</button><button class="btn" id="home">最初の画面へ</button></div>
      <div class="msg" id="smsg"></div>
      <p class="hint">ZIPには summary（条件ごと1行）・trials（1マスごと1行）・questionnaire・events・session の CSV と、全データの JSON が入ります。データはこの端末のブラウザにも残っています。</p>
      <div class="tablebox"><table class="list"><tr><th>順番</th><th>条件</th><th>正答数</th><th>解答数</th><th>正答率</th><th>解き終えた表</th><th>気分（快,覚醒）前→後</th></tr>${rows}</table></div>
    </details>`)}</div>`;
  $("#sv").onclick = async () => { const r = await saveFile(fileBase(S) + ".zip", sessionZip(S)); const m = $("#smsg"); m.className = "msg " + (r.ok ? "ok" : "err"); m.textContent = r.ok ? "保存しました。" : r.msg; if(r.ok){ S.saved_at = isoLocal(Date.now()); persist(); } };
  $("#sj").onclick = async () => { const r = await saveFile(fileBase(S) + "_raw.json", JSON.stringify(S, null, 1)); const m = $("#smsg"); m.className = "msg " + (r.ok ? "ok" : "err"); m.textContent = r.ok ? "保存しました。" : r.msg; };
  $("#home").onclick = () => {
    S = null;
    if(AUD.A){ releaseTrack(AUD.A); delete AUD.A; delete OFFS.A; }   // 自選曲は参加者ごとに選び直す
    renderSetup({text:"自選曲（A）の音源は外しました。次の参加者の曲を選んでください。"});
  };
};

    </section>

    <section class="panel"><h2><span class="step">5</span>この端末に残っているデータ</h2>
      ${list.length ? `<div class="tablebox"><table class="list"><tr><th>セッション</th><th>状態</th><th>条件</th><th>更新</th><th></th></tr>${list.map((r) => `<tr><td>${esc(r.id)}${r.test ? ' <span class="tag">TEST</span>' : ""}</td><td><span class="tag ${r.status === "done" ? "done" : r.status === "running" ? "run" : ""}">${({done:"終了", running:"途中", aborted:"中止"})[r.status] || esc(r.status)}</span></td><td class="num">${r.done_conds}/7</td><td class="num">${esc((r.updated||"").slice(5,16).replace("T"," "))}</td><td><div class="row" style="justify-content:flex-end;flex-wrap:nowrap"><button class="btn small" data-zip="${esc(r.id)}">保存（ZIP）</button><button class="btn small danger" data-del="${esc(r.id)}">削除</button></div></td></tr>`).join("")}</table></div>
        <div class="row" style="margin-top:10px"><button class="btn small" id="zipall">終了したセッションをまとめて保存（ZIP）</button></div>` : `<p class="hint" style="margin:0">まだありません。</p>`}
      <div class="msg" id="datamsg"></div>
    </section>
  </div>`;

  // 値の初期化
  const orderSel = $("#order");
  if(resume) orderSel.value = String(resume.order_no);
  else { const sug = suggestOrder(pid, week); orderSel.value = String(p.lastOrder && p.lastPid === pid && p.lastWeek === week ? p.lastOrder : (sug || 1)); }
  $("#theme").value = p.theme || DEFAULTS.theme;
  $("#practice").value = (resume ? resume.settings.practice !== false : (p.practice ?? DEFAULTS.practice)) ? "1" : "0";
  $("#practice").onchange = updChecks;
  if(resume && resume.self_lyrics != null) $("#selflyrics").value = resume.self_lyrics ? "1" : "0";
  $("#selflyrics").onchange = updChecks;
  $("#preshort").checked = resume ? !!resume.pre_short : week >= 2;
  if(resume) CODES.forEach((c) => { if(resume.audio_meta[c] && resume.audio_meta[c].offset_s != null) OFFS[c] = resume.audio_meta[c].offset_s; });
  if(resume) $("#practice").disabled = true;
  if(resume){ ["rest_s","lead_s","task_s","practice_s"].forEach((k) => { if(resume.settings[k] != null) $("#" + k).value = resume.settings[k]; }); if(resume.settings.match_loudness != null) p.match = resume.settings.match_loudness; $("#test").checked = !!resume.test_mode; $("#vol").value = resume.settings.volume; $("#volv").textContent = resume.settings.volume + "%"; }

  const updOrder = () => {
    const n = parseInt(orderSel.value, 10), row = WILLIAMS[n-1];
    $("#orderline").innerHTML = `<span class="hint">この順で提示：</span>` + row.map((c, i) => `${i ? '<span class="arrow">→</span>' : ""}<span class="chip" title="${esc(COND[c].label)}">${c}</span>`).join("") + `<span class="hint" style="margin-left:8px">（${row.map((c) => COND[c].label).join("／")}）</span>`;
    const w = parseInt($("#week").value, 10), sug = suggestOrder($("#pid").value, w);
    $("#ordersug").innerHTML = sug ? `おすすめの番号：<b>${sug}</b>（${w ? "参加者番号と週から計算" : "予備予備実験は自選曲が4番目に来る6番"}）${sug !== n && !resume ? ` <button class="btn small" id="usesug">${sug}番にする</button>` : ""}　用紙の並び：シード ${seedFor(w)}` : `参加者IDに数字を入れると、おすすめの番号を出します。用紙の並び：シード ${seedFor(w)}`;
    const u = $("#usesug"); if(u) u.onclick = () => { orderSel.value = String(sug); updOrder(); updChecks(); };
  };
  orderSel.onchange = () => { updOrder(); updChecks(); };
  const fillPerson = () => {
    if(resume) return;
    const who = (prefs().people || {})[$("#pid").value.normalize("NFKC").trim()];
    if(!who) return;
    if(!$("#selfsong").value && who.self_song) $("#selfsong").value = who.self_song;
    if($("#selflyrics").value === "" && who.self_lyrics != null) $("#selflyrics").value = who.self_lyrics ? "1" : "0";
    if(!AUD.A && who.offA != null) OFFS.A = who.offA;
    refreshAudioRows();
  };
  $("#pid").oninput = () => { fillPerson(); updOrder(); updChecks(); };
  $("#week").onchange = () => { const w = parseInt($("#week").value, 10); $("#preshort").checked = w >= 2; const sug = suggestOrder($("#pid").value, w); if(sug) orderSel.value = String(sug); updOrder(); updChecks(); };
  $("#vol").oninput = () => { $("#volv").textContent = $("#vol").value + "%"; };
  $("#theme").onchange = () => { setTheme($("#theme").value); const q = prefs(); q.theme = $("#theme").value; savePrefs(q); };
  $("#test").onchange = remeasureAll;
  $("#task_s").onchange = remeasureAll;
  $("#lead_s").onchange = remeasureAll;
  $("#match").checked = p.match ?? true;
  $("#match").onchange = refreshAudioRows;
  attachEmbedded(false);
  $("#multi").onchange = (e) => { const got = autoAssign(Array.from(e.target.files || [])); $("#multimsg").textContent = got.length ? `振り分けました：${got.join("、")}` : "振り分けられるファイルがありませんでした。行ごとに選んでください。"; e.target.value = ""; };
  updOrder();
  fillPerson();
  refreshAudioRows();

  // 途中のセッション・残っているデータ
  $$("[data-resume]").forEach((b) => b.onclick = () => { resumeId = b.dataset.resume; renderSetup(); });
  $$("[data-close]").forEach((b) => b.onclick = () => { const s = loadSession(b.dataset.close); if(s){ s.status = "aborted"; s.events.push({...stamp(), type:"closed_from_setup", phase:"", pos:"", code:"", detail:""}); S = s; persist(); S = null; } renderSetup(); });
  $$("[data-zip]").forEach((b) => b.onclick = async () => { const s = loadSession(b.dataset.zip); const m = $("#datamsg"); if(!s){ m.className = "msg err"; m.textContent = "データが読めませんでした。"; return; } const r = await saveFile(fileBase(s) + (s.status === "done" ? "" : "_partial") + ".zip", sessionZip(s)); m.className = "msg " + (r.ok ? "ok" : "err"); m.textContent = r.ok ? "保存しました。" : r.msg; });
  $$("[data-del]").forEach((b) => b.onclick = () => {
    if(!b.dataset.armed){ b.dataset.armed = "1"; b.textContent = "本当に削除"; setTimeout(() => { if(b.isConnected){ delete b.dataset.armed; b.textContent = "削除"; } }, 4000); return; }
    LS.del(SKEY(b.dataset.del)); writeIndex(readIndex().filter((x) => x.id !== b.dataset.del)); renderSetup({text:"削除しました。"});
  });
  const za = $("#zipall"); if(za) za.onclick = async () => {
    const files = []; readIndex().filter((x) => x.status === "done").forEach((x) => { const s = loadSession(x.id); if(!s) return; const t = tables(s), b = fileBase(s);
      files.push({name:`${b}_summary.csv`, data:csv(t.summary, SUM_COLS)}, {name:`${b}_trials.csv`, data:csv(t.trials, TRIAL_COLS)}, {name:`${b}_questionnaire.csv`, data:csv(t.quest, Q_COLS)}, {name:`${b}_events.csv`, data:csv(t.events, EV_COLS)}, {name:`${b}_session.csv`, data:csv(t.session, SES_COLS)}, {name:`${b}_raw.json`, data:JSON.stringify(s)}); });
    const m = $("#datamsg"); if(!files.length){ m.className = "msg err"; m.textContent = "終了したセッションがありません。"; return; }
    const d = new Date(), r = await saveFile(`music100_all_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.zip`, makeZip(files)); m.className = "msg " + (r.ok ? "ok" : "err"); m.textContent = r.ok ? "保存しました。" : r.msg;
  };
  const cr = $("#cancelResume"); if(cr) cr.onclick = () => { resumeId = null; renderSetup(); };

  $("#start").onclick = () => startSession(false);
  $("#startFs").onclick = () => startSession(true);
  updChecks();
}

function refreshAudioRows(){
  const box = $("#audiolist"); if(!box) return;
  const need = setupNeed();
  let h = `<div class="arow head"><div>コード</div><div>条件</div><div>音源</div><div>開始位置</div><div></div></div>`;
  CODES.forEach((c) => {
    const a = AUD[c], emb = EMB[c];
    if(c === "G"){ h += `<div class="arow"><div><span class="chip">G</span></div><div class="cond"><b>${COND.G.label}</b><small>${esc(COND.G.song)}</small></div><div class="file hint">ファイルは不要（何も流さない）</div><div></div><div></div></div>`; return; }
    let st = `<span class="ng">未選択</span>`;
    if(a){
      const off = a.embedded ? 0 : (OFFS[c] || 0);
      const short = a.duration != null && (a.duration - off) < need - 0.3;
      let loud = "";
      if(a.embedded) loud = `内蔵：元の曲の${a.source_start_s}秒から${mmss(a.duration)}・${a.lufs} LUFS`;
      else if(a.measuring) loud = "音の大きさを測っています…";
      else if(a.measure_error) loud = "音の大きさを測れませんでした（そのままの音量で流します）";
      else if(a.lufs != null) loud = `${a.lufs} LUFS → ${matchOn() ? `${fmtDb(autoGain(a))} して ${TARGET_LUFS} LUFS にそろえる${a.capped ? "（音が割れないよう上げ幅を制限）" : ""}` : "そろえない（そのまま）"}`;
      st = a.decoding ? `<span class="hint">読み込み中…</span> ${esc(a.name)}`
        : a.error ? `<span class="ng">読み込めません：${esc(a.name)}</span><br><span class="hint" style="font-size:12px">MP3 に変換すると読めます（make_clips.py）</span>`
        : `<span class="${short ? "ng" : "ok"}">${short ? "短い" : "✓"}</span> ${esc(a.name)} <span class="num hint">${mmss(a.duration)}</span>${short ? `<br><span class="ng" style="font-size:12px">開始位置から${need}秒に足りません</span>` : ""}<br><span class="hint" style="font-size:12px">${esc(loud)}</span>`;
    }
    const offCell = a && a.embedded ? `<span class="hint" style="font-size:12px">0秒（切り出し済み）</span>`
      : `<label class="offset">開始<input type="number" id="off_${c}" value="${esc(String(OFFS[c] ?? 0))}" min="0" step="0.1" style="width:64px">秒</label>`;
    h += `<div class="arow"><div><span class="chip">${c}</span></div><div class="cond"><b>${COND[c].label}</b><small>${esc(COND[c].song)}</small></div>
      <div class="file">${st}</div>${offCell}
      <div class="acts row" style="flex-wrap:nowrap"><label class="btn small" for="file_${c}">${emb ? "別のファイル" : "選ぶ"}</label><input type="file" id="file_${c}" accept="audio/*,.mp3,.m4a,.wav,.aac,.flac,.ogg,.webm,.opus" hidden>${emb && a && !a.embedded ? `<button class="btn small" data-emb="${c}">内蔵に戻す</button>` : ""}<button class="btn small" data-prev="${c}" ${a && !a.error && !a.decoding ? "" : "disabled"}>${previewing && previewing.code === c ? "停止" : "試聴"}</button></div></div>`;
  });
  box.innerHTML = h;
  CODES.forEach((c) => {
    const f = $(`#file_${c}`); if(f) f.onchange = (e) => { const file = e.target.files && e.target.files[0]; if(file) attachAudio(c, file); };
    const o = $(`#off_${c}`); if(o) o.onchange = () => { OFFS[c] = Math.max(0, parseFloat(o.value) || 0); measureTrack(c); refreshAudioRows(); };
  });
  $$("[data-prev]").forEach((b) => b.onclick = () => preview(b.dataset.prev));
  $$("[data-emb]").forEach((b) => b.onclick = () => { const c = b.dataset.emb; attachAudio(c, embeddedBlob(c), true); });
  updChecks();
}
function remeasureAll(){ CODES.forEach((c) => { if(AUD[c] && !AUD[c].embedded) measureTrack(c); }); refreshAudioRows(); }

function setupValues(){
  const test = $("#test").checked;
  const num = (id, d, min=0.001) => { const v = parseFloat($("#" + id).value); return isFinite(v) && v >= min ? v : d; };
  return {
    pid: $("#pid").value.normalize("NFKC").trim(), week: parseInt($("#week").value, 10), order_no: parseInt($("#order").value, 10),
    self_song: $("#selfsong").value.trim(), self_lyrics: $("#selflyrics").value === "" ? null : $("#selflyrics").value === "1", pre_short: $("#preshort").checked, test,
    settings: {
      rest_s: test ? TEST.rest_s : num("rest_s", DEFAULTS.rest_s), lead_s: test ? TEST.lead_s : num("lead_s", DEFAULTS.lead_s, 0),
      task_s: test ? TEST.task_s : num("task_s", DEFAULTS.task_s),
      practice: $("#practice").value === "1", practice_s: test ? TEST.practice_s : num("practice_s", DEFAULTS.practice_s), break_s: 0,
      volume: parseInt($("#vol").value, 10), theme: $("#theme").value, match_loudness: $("#match").checked, target_lufs: TARGET_LUFS,
    },
  };
}
function updChecks(){
  const ul = $("#checks"); if(!ul) return;
  const v = setupValues();
  const idOk = /^[A-Za-z0-9_-]{1,24}$/.test(v.pid);
  const missing = CODES.filter((c) => c !== "G" && (!AUD[c] || AUD[c].error || AUD[c].decoding));
  const measuring = CODES.filter((c) => AUD[c] && AUD[c].measuring);
  const need = setupNeed();
  const short = CODES.filter((c) => { const a = AUD[c]; return a && a.duration != null && (a.duration - (a.embedded ? 0 : (OFFS[c] || 0))) < need - 0.3; });
  const items = [
    [idOk, idOk ? `参加者ID：${v.pid}` : "参加者IDを入れてください（半角の英数字・-・_）"],
    [v.self_lyrics != null, v.self_lyrics == null ? `自選曲の歌詞の有無を選んでください（歌詞の質問を出すかが決まります）${v.test ? "（テストでは無しでも進めます）" : ""}` : `自選曲：${v.self_lyrics ? "歌詞あり（歌詞の質問を出す）" : "歌詞なし（歌詞の質問は出さない）"}`],
    [missing.length === 0, missing.length ? `音源が未選択：${missing.join("・")}${v.test ? "（テストでは無しでも進めます）" : ""}` : "音源：A〜F そろっています"],
    [measuring.length === 0, measuring.length ? `音の大きさを測っています：${measuring.join("・")}` : `音の大きさ：${v.settings.match_loudness ? `すべて ${TARGET_LUFS} LUFS` : "選んだファイルはそのまま"}`],
    [short.length === 0, short.length ? `音源が短い：${short.join("・")}（${need}秒必要）` : `1条件：スペースキーで曲が流れ始める → ${v.settings.lead_s}秒後に計算が始まる → 曲を聴きながらかけ算${v.settings.task_s}秒（曲は${need}秒で終わる）`],
    [true, `安静${v.settings.rest_s}秒・練習${v.settings.practice ? `あり（${v.settings.practice_s}秒）` : "なし"}${v.test ? "（テスト）" : ""}`],
  ];
  ul.innerHTML = items.map(([ok, t]) => `<li class="${ok ? "ok" : "ng"}"><span class="m">${ok ? "✓" : "!"}</span><span>${esc(t)}</span></li>`).join("");
  const can = idOk && measuring.length === 0 && ((missing.length === 0 && short.length === 0 && v.self_lyrics != null) || v.test);
  ["#start", "#startFs"].forEach((s) => { const b = $(s); if(b) b.disabled = !can; });
}

function startSession(fs){
  const v = setupValues();
  stopPreview();
  if(fs){ try{ const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if(r && r.catch) r.catch(() => {}); }catch(e){} }
  try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").catch(() => {}); }catch(e){}
  unlockAudio();
  const q = prefs(); Object.assign(q, {lastPid:v.pid, lastWeek:v.week, lastOrder:v.order_no, volume:v.settings.volume, theme:v.settings.theme, match:v.settings.match_loudness});
  if(!v.test) Object.assign(q, {v:PREFS_V, rest_s:v.settings.rest_s, lead_s:v.settings.lead_s, task_s:v.settings.task_s, practice_s:v.settings.practice_s, practice:v.settings.practice});
  if(v.pid) q.people = {...(q.people || {}), [v.pid]: {self_song:v.self_song, self_lyrics:v.self_lyrics, offA:OFFS.A || 0}};   // 参加者ごとに覚える（2週目以降の入力を楽にする）
  savePrefs(q);
  setTheme(v.settings.theme);
  const audioMeta = {};
  CODES.forEach((c) => {
    const a = AUD[c];
    if(c === "G" || !a){ audioMeta[c] = {file:null}; return; }
    a.gain_db = autoGain(a); a.pcm = null;   // 測定用に読み込んだデータは捨てる
    audioMeta[c] = {file:a.name, embedded:a.embedded, source:a.source, source_start_s:a.source_start_s, size:a.size, mode:a.mode,
      duration_s: a.duration ? Math.round(a.duration * 100) / 100 : null, offset_s: a.embedded ? 0 : (OFFS[c] || 0),
      lufs:a.lufs ?? null, peak_db:a.peak_db ?? null, gain_db:a.gain_db, capped:!!a.capped};
  });
  if(resumeId){
    const s = loadSession(resumeId); resumeId = null;
    if(!s){ renderSetup({text:"データが読めませんでした。", err:true}); return; }
    S = s; S.audio_meta = audioMeta; S.settings.volume = v.settings.volume; S.settings.theme = v.settings.theme; S.status = "running";
    if(S.settings.lead_s == null) S.settings.lead_s = v.settings.lead_s;
    if(S.settings.match_loudness == null) S.settings.match_loudness = v.settings.match_loudness;
    S.resumes = (S.resumes || 0) + 1;
    // 途中だった段階を巻き戻す
    let ph = S.phases[S.phase_idx];
    if(ph.pos){
      const back = S.phases.findIndex((x) => x.type === "ready" && x.pos === ph.pos);
      const old = S.conds[ph.pos];
      if(old && (old.rest || old.task)){ S.discarded = S.discarded || []; S.discarded.push({reason:"resume", pos:ph.pos, data:old}); }
      S.conds[ph.pos] = newCond(ph.pos, S.order[ph.pos-1]); S.conds[ph.pos].restarts = (old && old.restarts || 0) + 1;
      S.phase_idx = back;
    } else if(ph.type === "practice" && S.practice){ S.discarded = S.discarded || []; S.discarded.push({reason:"resume", phase:"practice", data:S.practice}); S.practice = null; }
    logEvent("resumed", {phase_idx:S.phase_idx, audio:Object.fromEntries(CODES.map((c) => [c, audioMeta[c].file]))});
    go(); return;
  }
  const d = new Date(), id = `${v.pid}_w${v.week}_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  const seed = seedFor(v.week);
  S = {
    app:"music100", app_version:APP_VERSION, session_id:id, participant_id:v.pid, week:v.week, order_no:v.order_no, order:WILLIAMS[v.order_no-1],
    test_mode:v.test, pre_short:v.pre_short, self_song:v.self_song, self_lyrics:v.self_lyrics, settings:v.settings, sheet_seed:seed, sheets:makeSheets(seed), audio_meta:audioMeta,
    env:{ua:navigator.userAgent, screen:`${screen.width}x${screen.height}@${window.devicePixelRatio || 1}`, viewport:`${innerWidth}x${innerHeight}`, tz:Intl.DateTimeFormat().resolvedOptions().timeZone || "", in_artifact:inArtifact()},
    created_at:isoLocal(Date.now()), status:"running", phases:buildPhases(v.settings.practice), phase_idx:0,
    pre:null, post:null, practice:null, conds:{}, break:null, events:[], markers:[],
  };
  for(let k=1;k<=7;k++) S.conds[k] = newCond(k, S.order[k-1]);
  logEvent("session_start", {order:S.order.join(""), seed, settings:S.settings, audio:Object.fromEntries(CODES.map((c) => [c, audioMeta[c].file]))});
  go();
}

/* ---------- 全体のイベント ---------- */
document.addEventListener("fullscreenchange", () => { if(S && S.status === "running") logEvent(document.fullscreenElement ? "fullscreen_on" : "fullscreen_off"); });
window.addEventListener("beforeunload", (e) => { if(S && S.status === "running"){ persist(); e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("visibilitychange", () => { if(S && S.status === "running" && document.hidden) persist(); });

getDownloads();
renderSetup();
</script>
